<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Context Architectural Diagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1e293b;
  }
  #ui-container {
    position: absolute; top: 20px; left: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 12px;
    pointer-events: none;
  }
  .card {
    display: none !important;

    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(226, 232, 240, 0.9);
    border-radius: 12px; padding: 18px 22px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
    pointer-events: auto; max-width: 320px;
  }
  .card h1 {
    font-size: 16px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: #0f172a; margin-bottom: 4px;
  }
  .card .subtitle {
    font-size: 12px; color: #64748b; margin-bottom: 12px; font-weight: 500;
  }
  .metrics-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
    font-size: 12px; border-top: 1px solid #f1f5f9; padding-top: 10px;
  }
  .metric-item { display: flex; flex-direction: column; }
  .metric-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .metric-val { font-weight: 600; color: #1e293b; font-size: 13px; }

  /* Top-Right Controls Bar (Axonometric & Perspective ONLY) */
  #controls-bar {
    position: absolute; top: 20px; right: 20px; z-index: 10;
    display: flex; gap: 6px; background: rgba(255, 255, 255, 0.95);
    padding: 5px; border-radius: 10px;
    border: 1px solid rgba(226, 232, 240, 0.9);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
  }
  .toggle-btn {
    border: none; background: transparent; padding: 8px 14px;
    border-radius: 6px; font-size: 12px; font-weight: 600;
    color: #64748b; cursor: pointer; transition: all 0.2s ease;
  }
  .toggle-btn.active {
    background: #0f172a; color: #ffffff;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
  }
  .toggle-btn:hover:not(.active) {
    background: #f1f5f9; color: #334155;
  }

  /* Interactive Blender Orientation Gizmo Container directly under the top-right bar */
  #gizmo-container {
    position: absolute; top: 72px; right: 20px; z-index: 10;
    width: 120px; height: 120px;
    pointer-events: auto;
  }

  #tooltip {
    position: absolute; z-index: 20; display: none;
    background: #ffffff;
    border: 1px solid rgba(203, 213, 225, 0.95);
    border-radius: 10px;
    padding: 12px 16px;
    color: #0f172a;
    font-size: 12px; font-weight: 500;
    pointer-events: none;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    line-height: 1.6;
  }
  canvas { display: block; }
</style>
</head>
<body>

<div id="ui-container">
  <div class="card">
    <h1 id="title-text">Urban Context</h1>
    <div class="subtitle" id="coords-text">Architectural Site Study</div>
    <div class="metrics-grid">
      <div class="metric-item"><span class="metric-label">Site Area</span><span class="metric-val" id="val-area">-</span></div>
      <div class="metric-item"><span class="metric-label">Area Tier</span><span class="metric-val" id="val-tier">-</span></div>
      <div class="metric-item"><span class="metric-label">FAR</span><span class="metric-val" id="val-far">-</span></div>
      <div class="metric-item"><span class="metric-label">Buildings</span><span class="metric-val" id="val-bldgs">-</span></div>
    </div>
  </div>
</div>

<div id="controls-bar">
  <button class="toggle-btn active" id="btn-ortho">Axonometric</button>
  <button class="toggle-btn" id="btn-persp">Perspective</button>
</div>

<!-- Blender Orientation Gizmo widget div placed directly below top-right bar -->

try {
  const savedState = localStorage.getItem('context_generator_camera_view');
  if (savedState) {
    const view = JSON.parse(savedState);
    if (
      view &&
      view.pos &&
      Array.isArray(view.pos) &&
      !isNaN(view.pos[0]) &&
      !isNaN(view.pos[1]) &&
      !isNaN(view.pos[2]) &&
      (Math.abs(view.pos[0]) > 0.001 || Math.abs(view.pos[1]) > 0.001 || Math.abs(view.pos[2]) > 0.001) &&
      view.target &&
      Array.isArray(view.target) &&
      !isNaN(view.target[0]) &&
      !isNaN(view.target[1]) &&
      !isNaN(view.target[2])
    ) {
      cameraOrtho.position.set(view.pos[0], view.pos[1], view.pos[2]);
      cameraPersp.position.set(view.pos[0], view.pos[1], view.pos[2]);
      if (view.zoom) cameraOrtho.zoom = view.zoom;
      cameraOrtho.updateProjectionMatrix();
      cameraPersp.updateProjectionMatrix();
      controls.target.set(view.target[0], view.target[1], view.target[2]);
      if (view.isPersp) {
        activeCamera = cameraPersp;
        controls.object = cameraPersp;
      }
    }
  }
} catch (e) {}

controls.update();

controls.addEventListener('change', () => {

      pos: [activeCamera.position.x, activeCamera.position.y, activeCamera.position.z],
      target: [controls.target.x, controls.target.y, controls.target.z],
      zoom: cameraOrtho.zoom,

function createTickLabel(text) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  texture.minFilter = THREE.LinearFilter;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
  sprite.scale.set(14, 7, 1);
  return sprite;
}

// --- Helper: Build Architectural Volume with STRICT NORMAL FILTERING ---
// 1. Base Mesh: Roofs & sun-facing walls stay 100% PURE PAPER WHITE (#ffffff).
//    Back-facing unlit walls (N·L <= 0.05) take a uniform, crisp architectural self-shadow color (#d8dfe8).
// 2. Shadow Overlay Mesh: Contains ONLY SUN-FACING FACES (N·L > 0.05)!
//    Back-facing unlit walls are 100% EXCLUDED from receiving cast shadows, guaranteeing ZERO cast-shadow cuts on unlit walls!
function createArchitecturalVolume(verts, faces, colorHex = 0xffffff, opacity = 1.0, isRoad = false) {
  const group = new THREE.Group();

  const numTriangles = faces.length;
  const pos = new Float32Array(numTriangles * 9);
  const colors = new Float32Array(numTriangles * 9);

  const pureWhite = new THREE.Color(colorHex);
  const selfShadowColor = new THREE.Color(0xf0f0f0); // Soft Lighter Pure Monochrome Grey (R=240, G=240, B=240)

  const sunFacingPositions = [];

  for (let fi = 0; fi < numTriangles; fi++) {
    const f = faces[fi];
    const p0 = new THREE.Vector3(verts[f[0]][0], verts[f[0]][2], -verts[f[0]][1]);
    const p1 = new THREE.Vector3(verts[f[1]][0], verts[f[1]][2], -verts[f[1]][1]);
    const p2 = new THREE.Vector3(verts[f[2]][0], verts[f[2]][2], -verts[f[2]][1]);

    // Compute exact face normal
    const vA = new THREE.Vector3().subVectors(p1, p0);
    const vB = new THREE.Vector3().subVectors(p2, p0);
    const faceNormal = new THREE.Vector3().crossVectors(vA, vB).normalize();

    // Check orientation relative to sun light direction
    const dot = faceNormal.dot(sunVector);
    const isSunFacing = (isRoad || dot > 0.05);
    const c = isSunFacing ? pureWhite : selfShadowColor;

    for (let vi = 0; vi < 3; vi++) {
      const v = verts[f[vi]];
      pos[fi * 9 + vi * 3 + 0] = v[0];
      pos[fi * 9 + vi * 3 + 1] = v[2];
      pos[fi * 9 + vi * 3 + 2] = -v[1];

      colors[fi * 9 + vi * 3 + 0] = c.r;
      colors[fi * 9 + vi * 3 + 1] = c.g;
      colors[fi * 9 + vi * 3 + 2] = c.b;
    }

    // Collect ONLY sun-facing triangles for cast-shadow overlay
    if (isSunFacing && !isRoad) {
      for (let vi = 0; vi < 3; vi++) {
        const v = verts[f[vi]];
        sunFacingPositions.push(v[0], v[2], -v[1]);
      }
    }
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geom.computeVertexNormals();

  // Base Mesh: MeshBasicMaterial guarantees 100% PURE PAPER WHITE on sun-facing faces & roofs!
  const baseMat = new THREE.MeshBasicMaterial({
    vertexColors: true,
    transparent: opacity < 1.0,
    opacity: opacity,
    polygonOffset: isRoad,
    polygonOffsetFactor: isRoad ? 2.0 : 0.0,
    polygonOffsetUnits: isRoad ? 2.0 : 0.0,
  });
  const baseMesh = new THREE.Mesh(geom, baseMat);
  group.add(baseMesh);

  if (!isRoad) {
    // Caster mesh: casts soft directional shadow map onto other structures
    const casterMat = new THREE.MeshBasicMaterial({ colorWrite: false });
    const casterMesh = new THREE.Mesh(geom, casterMat);
    casterMesh.castShadow = true;
    group.add(casterMesh);

    // Receiver shadow overlay mesh: ONLY contains SUN-FACING faces!
    // Unlit back walls are 100% EXCLUDED, preventing any cast-shadow bleeding onto unlit walls!
    if (sunFacingPositions.length > 0) {
      const sunGeom = new THREE.BufferGeometry();
      sunGeom.setAttribute('position', new THREE.Float32BufferAttribute(sunFacingPositions, 3));
      sunGeom.computeVertexNormals();

      const buildingShadowOverlay = new THREE.Mesh(sunGeom, sharedShadowMat);
      buildingShadowOverlay.receiveShadow = true;
      group.add(buildingShadowOverlay);
    }
  }

  return { geom, baseMesh, group };
}

// --- Render Context Buildings ---

// --- Smooth Camera View Snap Function (Works 100% in Perspective & Axonometric Modes) ---
let isAnimatingCamera = false;
let animStartTime = 0;
let animStartPos = new THREE.Vector3();
let animEndPos = new THREE.Vector3();
const ANIM_DURATION = 350; // ms

function snapToView(dirX, dirY, dirZ) {
  const target = controls.target.clone();
  animStartPos.copy(activeCamera.position);

  // Enforce standard Y-up vector to maintain smooth, unbroken OrbitControls mouse rotation
  cameraOrtho.up.set(0, 1, 0);
  cameraPersp.up.set(0, 1, 0);

  if (dirY === 1) {
    // Top view (Z height axis) - preserve current view heading to snap to nearest rotation
    const dx = animStartPos.x - target.x;
    const dz = animStartPos.z - target.z;
    const dist2d = Math.hypot(dx, dz);
    const angle = dist2d > 0.001 ? Math.atan2(dx, dz) : 0;
    const eps = 0.001 * camDist;
    animEndPos.set(target.x + eps * Math.sin(angle), target.y + camDist, target.z + eps * Math.cos(angle));
  } else if (dirY === -1) {
    // Bottom view
    const dx = animStartPos.x - target.x;
    const dz = animStartPos.z - target.z;
    const dist2d = Math.hypot(dx, dz);
    const angle = dist2d > 0.001 ? Math.atan2(dx, dz) : 0;
    const eps = 0.001 * camDist;
    animEndPos.set(target.x + eps * Math.sin(angle), target.y - camDist, target.z + eps * Math.cos(angle));
  } else if (dirX === 1) {
    animEndPos.set(target.x + camDist, target.y, target.z);
  } else if (dirX === -1) {
    animEndPos.set(target.x - camDist, target.y, target.z);
  } else if (dirZ === 1) {
    animEndPos.set(target.x, target.y, target.z + camDist);
  } else if (dirZ === -1) {
    animEndPos.set(target.x, target.y, target.z - camDist);
  }

  animStartTime = performance.now();
  isAnimatingCamera = true;
}

// --- Custom Interactive Blender Orientation Gizmo Widget ---
const gizmoContainer = document.getElementById('gizmo-container');
const gizmoCanvas = document.createElement('canvas');
gizmoCanvas.width = 240; // 2x hidpi
gizmoCanvas.height = 240;
gizmoCanvas.style.width = '120px';
gizmoCanvas.style.height = '120px';
gizmoContainer.appendChild(gizmoCanvas);
const gctx = gizmoCanvas.getContext('2d');

// Gizmo Axis Definitions: Blender CAD Standards
// X = Red (#ef4444) [Horizontal Right]
// Y = Green (#22c55e) [Horizontal Depth]
// Z = Blue (#3b82f6) [Vertical Height]
const AXES = [
  { label: 'X', dir: [1, 0, 0], color: '#ef4444', isNeg: false },
  { label: 'Y', dir: [0, 0, 1], color: '#22c55e', isNeg: false },
  { label: 'Z', dir: [0, 1, 0], color: '#3b82f6', isNeg: false },
  { label: '-X', dir: [-1, 0, 0], color: '#ef4444', isNeg: true },
  { label: '-Y', dir: [0, 0, -1], color: '#22c55e', isNeg: true },
  { label: '-Z', dir: [0, -1, 0], color: '#3b82f6', isNeg: true },
];

let gizmoRenderNodes = [];

function drawGizmo() {
  gctx.clearRect(0, 0, 240, 240);
  const cx = 120, cy = 120, r = 75;

  // Get current camera orientation matrix
  const mat = new THREE.Matrix4();
  mat.extractRotation(activeCamera.matrixWorldInverse);
  
  // Transform axis directions
  const projected = AXES.map((axis) => {
    const vec = new THREE.Vector3(...axis.dir).applyMatrix4(mat);
    return {
      ...axis,
      px: cx + vec.x * r,
      py: cy - vec.y * r,
      pz: vec.z,
    };
  });

  // Sort back-to-front by depth (pz)
  projected.sort((a, b) => a.pz - b.pz);
  gizmoRenderNodes = projected;

  // Draw connecting axis lines from center
  for (const node of projected) {
    gctx.beginPath();
    gctx.moveTo(cx, cy);
    gctx.lineTo(node.px, node.py);
    gctx.strokeStyle = node.isNeg ? '#cbd5e1' : node.color;
    gctx.lineWidth = node.isNeg ? 2 : 4;
    gctx.stroke();
  }

  // Draw node circles
  for (const node of projected) {
    gctx.beginPath();
    const radius = node.isNeg ? 10 : 16;
    gctx.arc(node.px, node.py, radius, 0, Math.PI * 2);

    if (node.isNeg) {
      gctx.fillStyle = '#ffffff';
      gctx.fill();
      gctx.strokeStyle = node.color;
      gctx.lineWidth = 3;
      gctx.stroke();
    } else {
      gctx.fillStyle = node.color;
      gctx.fill();
      gctx.font = 'bold 18px Inter, sans-serif';
      gctx.textAlign = 'center';
      gctx.textBaseline = 'middle';
      gctx.fillStyle = '#ffffff';
      gctx.fillText(node.label, node.px, node.py + 1);
    }
  }
}

// Handle Gizmo Mouse Clicks on Nodes (Works 100% in Perspective AND Axonometric)
gizmoCanvas.addEventListener('click', (e) => {
  const rect = gizmoCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * 2;
  const my = (e.clientY - rect.top) * 2;

  // Check hit from front to back
  const clickable = [...gizmoRenderNodes].reverse();
  for (const node of clickable) {
    const dist = Math.hypot(mx - node.px, my - node.py);
    const radius = node.isNeg ? 12 : 18;
    if (dist <= radius) {
      snapToView(node.dir[0], node.dir[1], node.dir[2]);
      break;
    }
  }
});

// --- Camera Switch Controls (Axonometric vs Perspective) ---
const btnPersp = document.getElementById('btn-persp');
const btnOrtho = document.getElementById('btn-ortho');

function setCamera(cameraMode) {
  const prevCam = activeCamera;
  if (cameraMode === 'ortho') {
    activeCamera = cameraOrtho;
    btnOrtho.classList.add('active');
    btnPersp.classList.remove('active');
  } else {
    activeCamera = cameraPersp;
    btnPersp.classList.add('active');
    btnOrtho.classList.remove('active');
  }
  activeCamera.position.copy(prevCam.position);
  controls.object = activeCamera;
  controls.update();
}

btnPersp.addEventListener('click', () => setCamera('persp'));
btnOrtho.addEventListener('click', () => setCamera('ortho'));

// --- Clean Architectural Building Tooltips ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hoveredObj = null;

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, activeCamera);
  const hits = raycaster.intersectObjects(interactiveObjects);

  if (hoveredObj) {
    hoveredObj.material.color.setHex(hoveredObj.userData.isSite ? 0xfca5a5 : 0xffffff);
    hoveredObj = null;
  }

  if (hits.length > 0) {
    const obj = hits[0].object;
    hoveredObj = obj;

    if (obj.userData.isSite) {
      obj.material.color.setHex(0xf87171);
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
      tooltip.innerHTML = `
        <div style="font-weight:700; color:#0f172a; font-size:13px; margin-bottom:6px;">Testing Site Parcel</div>
        <div style="color:#334155; margin-bottom:3px;"><b style="color:#0f172a;">Site Area:</b> ${obj.userData.area} m² (${obj.userData.tier} Tier)</div>
        <div style="color:#334155; margin-bottom:3px;"><b style="color:#0f172a;">Context Height:</b> ${obj.userData.avgHeight}m | ${obj.userData.maxHeight}m</div>
        <div style="color:#334155;"><b style="color:#0f172a;">Context Storeys:</b> ${obj.userData.avgFloors} | ${obj.userData.maxFloors}</div>
      `;
    } else if (obj.userData.isBuilding) {
      obj.material.color.setHex(0xe2e8f0);
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
      tooltip.innerHTML = `
        <div style="font-weight:700; color:#0f172a; font-size:13px; margin-bottom:6px;">${obj.userData.use}</div>
        <div style="color:#334155; margin-bottom:3px;"><b style="color:#0f172a;">Footprint:</b> ${obj.userData.area} m²</div>
        <div style="color:#334155; margin-bottom:3px;"><b style="color:#0f172a;">Height:</b> ${obj.userData.height} m</div>
        <div style="color:#334155;"><b style="color:#0f172a;">Storeys:</b> ${obj.userData.floors}</div>

// --- Resize ---
window.addEventListener('resize', () => {
  const newAspect = window.innerWidth / window.innerHeight;
  cameraPersp.aspect = newAspect;
  cameraPersp.updateProjectionMatrix();

  cameraOrtho.left = -orthoSize * newAspect;
  cameraOrtho.right = orthoSize * newAspect;
  cameraOrtho.top = orthoSize;
  cameraOrtho.bottom = -orthoSize;
  cameraOrtho.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Animation Loop ---
function animate() {
  requestAnimationFrame(animate);

  // Smooth camera view snap animation
  if (isAnimatingCamera) {
    const now = performance.now();
    const progress = Math.min(1.0, (now - animStartTime) / ANIM_DURATION);
    const easeProgress = 1 - Math.pow(1 - progress, 3); // cubic ease out

    controls.enabled = false;
    activeCamera.position.lerpVectors(animStartPos, animEndPos, easeProgress);
    activeCamera.lookAt(controls.target);

    if (progress >= 1.0) {
      isAnimatingCamera = false;
      controls.enabled = true;
      controls.update();
    }
  } else {
    controls.update();
  }

  renderer.render(scene, activeCamera);

  // Render dynamic Blender orientation gizmo widget
  drawGizmo();
}
animate();
</script>
